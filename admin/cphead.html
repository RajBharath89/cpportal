<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP Heads - CoEvolve Organization</title>
    <link rel="apple-touch-icon" href="https://coevolvegroup.com/assets/images/fav.png" />
   <link rel="shortcut icon" type="image/x-icon" href="https://coevolvegroup.com/assets/images/fav.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        html, body {
            font-family: 'Inter', sans-serif;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        
        .main-wrapper {
            display: flex;
            height: calc(100vh - 68px);
            margin-top: 68px;
        }
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        @media (min-width: 768px) {
            .main-content {
                padding: 2rem 2rem 1rem 2rem;
            }
        }
        
        .table-container {
            overflow: hidden;
        }
        
        .table-scroll {
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
        
        .table-scroll table {
            min-width: 1000px;
        }
        
        .dropdown-menu {
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .dropdown-menu.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        .action-menu {
            display: none;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .action-menu.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }
        
        .modal {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .modal.active {
            display: flex;
            opacity: 1;
        }
        
        .modal-content {
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        
        .modal.active .modal-content {
            transform: scale(1);
        }
        
        .nav-item {
            transition: all 0.3s ease;
            position: relative;
            border-bottom: 3px solid transparent;
        }
        
        .nav-item:hover {
            color: #95c13d;
            border-bottom-color: #95c13d;
        }
        
        .nav-item.active {
            color: #95c13d;
            border-bottom-color: #95c13d;
        }
        
        .badge-active {
            background: #f0f9e8;
            color: #166534;
        }
        
        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .badge-approved {
            background: #dcfce7;
            color: #166534;
        }
        
        .badge-rejected {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .action-icons {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }
        
        .notification.show {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Top Header -->
    <header class="bg-gray-800 shadow-sm fixed top-0 left-0 right-0 z-40 border-t-4" style="border-top-color: #95c13d;">
        <div class="flex items-center justify-between px-4 py-3">
            <!-- Mobile Menu Button and Logo -->
            <div class="flex items-center gap-3">
                <button onclick="toggleMobileMenu()" class="md:hidden text-white hover:text-gray-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                
                <!-- Logo -->
                <div class="flex items-center text-white">
                    <img src="https://coevolvegroup.com/assets/images/logos/primary-logo.png" alt="CoEvolve Logo" class="h-8 md:h-10 mr-2 md:mr-3">
                    <span class="font-semibold text-sm md:text-base">Admin</span>
                </div>
            </div>

            <!-- Navigation Bar - Hidden on mobile -->
            <nav class="hidden md:flex items-center space-x-1">
                <a href="cphead.html" class="nav-item active flex items-center gap-2 px-4 py-2 text-gray-200 font-medium text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    CP Heads
                </a>
                
                <a href="cpm.html" class="nav-item flex items-center gap-2 px-4 py-2 text-gray-200 font-medium text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    CP Managers
                </a>
                
                <a href="cp.html" class="nav-item flex items-center gap-2 px-4 py-2 text-gray-200 font-medium text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    Channel Partners
                </a>
                
                <a href="leads.html" class="nav-item flex items-center gap-2 px-4 py-2 text-gray-200 font-medium text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Leads
                </a>
            </nav>

            <!-- User Avatar -->
            <div class="relative">
                <button onclick="toggleUserMenu()" class="flex items-center gap-2 hover:bg-gray-900 rounded-lg px-2 md:px-3 py-2 transition-colors">
                    <div class="w-8 h-8 md:w-9 md:h-9 rounded-full flex items-center justify-center text-white font-semibold text-sm" style="background-color: #95c13d;">
                        AU
                    </div>
                    <div class="hidden lg:block text-left">
                        <div class="text-sm font-semibold text-gray-100">Admin User</div>
                    </div>
                    <svg class="w-4 h-4 text-gray-400 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                
                <!-- Dropdown Menu -->
                <div id="userMenu" class="dropdown-menu absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 py-1">
                    <a href="#" onclick="handleLogout()" class="flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                        Logout
                    </a>
                </div>
            </div>
        </div>
        
        <!-- Mobile Navigation Menu -->
        <div id="mobileMenu" class="md:hidden hidden bg-gray-700 border-t border-gray-600">
            <nav class="px-4 py-2 space-y-1">
                <a href="cphead.html" class="flex items-center gap-2 px-3 py-2 text-gray-200 font-medium text-sm bg-gray-600 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    CP Heads
                </a>
                
                <a href="cpm.html" class="flex items-center gap-2 px-3 py-2 text-gray-200 font-medium text-sm hover:bg-gray-600 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                    CP Managers
                </a>
                
                <a href="cp.html" class="flex items-center gap-2 px-3 py-2 text-gray-200 font-medium text-sm hover:bg-gray-600 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    Channel Partners
                </a>
                
                <a href="leads.html" class="flex items-center gap-2 px-3 py-2 text-gray-200 font-medium text-sm hover:bg-gray-600 rounded">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                    </svg>
                    Leads
                </a>
            </nav>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- Main Content -->
        <main class="main-content">
            <!-- Title and Stats Row -->
            <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-4 md:mb-6 gap-3 md:gap-4">
                <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                    <h1 class="text-xl md:text-2xl font-bold text-gray-900">CP Heads</h1>
                    <div class="flex items-center gap-2 md:gap-3 text-xs md:text-sm text-gray-600">
                        <span>Total: <span class="font-semibold text-gray-900" id="stat-total">0</span></span>
                        <span class="text-gray-300">|</span>
                        <span>Active: <span class="font-semibold text-green-600" id="stat-active">0</span></span>
                        <span class="text-gray-300">|</span>
                        <span>Inactive: <span class="font-semibold text-red-600" id="stat-inactive">0</span></span>
                    </div>
                </div>
                
                <button onclick="openAddModal()" class="flex items-center justify-center gap-2 px-4 md:px-5 py-2 font-semibold rounded-full transition-all text-xs md:text-sm whitespace-nowrap w-full md:w-auto" style="background: linear-gradient(135deg, #95c13d 0%, #7ba82d 100%); color: #ffffff;" onmouseover="this.style.background='linear-gradient(135deg, #a8d955 0%, #98c945 100%)'; this.style.transform='scale(1.02)';" onmouseout="this.style.background='linear-gradient(135deg, #95c13d 0%, #7ba82d 100%)'; this.style.transform='scale(1)';">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                    Add CP Head
                </button>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-3 md:px-4 py-3 border-b border-gray-200">
                    <div class="flex flex-wrap items-center gap-2">
                        <!-- Search Bar -->
                        <div class="w-full md:flex-1 md:min-w-[250px]">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                    </svg>
                                </div>
                                <input 
                                    type="text" 
                                    id="searchInput"
                                    onkeyup="filterTable()"
                                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 text-sm" 
                                    placeholder="Search by name, email, phone..."
                                >
                            </div>
                        </div>
                        
                        <!-- Status Filter -->
                        <div class="w-[48%] md:w-auto md:min-w-[140px] relative">
                            <button 
                                type="button"
                                onclick="toggleDropdown('statusDropdown')"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 text-sm text-left flex items-center justify-between bg-white"
                            >
                                <span id="statusFilterLabel" class="truncate">All Status</span>
                                <svg class="w-4 h-4 text-gray-400 ml-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>
                            <div id="statusDropdown" class="dropdown-menu absolute z-50 mt-1 w-48 bg-white border border-gray-300 rounded-lg shadow-lg max-h-60 overflow-y-auto">
                                <div class="p-2">
                                    <label class="flex items-center px-3 py-2 hover:bg-gray-50 rounded cursor-pointer">
                                        <input type="checkbox" value="active" onchange="updateStatusFilter()" class="status-checkbox w-4 h-4 text-green-600 rounded">
                                        <span class="ml-2 text-sm text-gray-700 whitespace-nowrap">Active</span>
                                    </label>
                                    <label class="flex items-center px-3 py-2 hover:bg-gray-50 rounded cursor-pointer">
                                        <input type="checkbox" value="inactive" onchange="updateStatusFilter()" class="status-checkbox w-4 h-4 text-green-600 rounded">
                                        <span class="ml-2 text-sm text-gray-700 whitespace-nowrap">Inactive</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Date Range Filter -->
                        <div class="w-[48%] md:w-auto md:min-w-[160px] relative">
                            <button 
                                type="button"
                                onclick="toggleDropdown('dateDropdown')"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500 text-sm text-left flex items-center justify-between bg-white"
                            >
                                <span id="dateFilterLabel" class="truncate">Date Range</span>
                                <svg class="w-4 h-4 text-gray-400 ml-2 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </button>
                            <div id="dateDropdown" class="dropdown-menu absolute z-50 mt-1 w-64 bg-white border border-gray-300 rounded-lg shadow-lg p-3">
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-700 mb-1">From Date</label>
                                        <input type="date" id="fromDate" onchange="updateDateFilter()" class="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-green-500">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-gray-700 mb-1">To Date</label>
                                        <input type="date" id="toDate" onchange="updateDateFilter()" class="w-full px-3 py-1.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-green-500">
                                    </div>
                                    <button onclick="clearDateFilter()" class="w-full px-3 py-1.5 text-sm text-gray-600 hover:text-gray-800 border border-gray-300 rounded hover:bg-gray-50">
                                        Clear Dates
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Reset Filters Button -->
                        <button onclick="resetAllFilters()" class="w-full md:w-auto flex items-center justify-center gap-2 px-3 py-2 font-semibold rounded-lg transition-all text-sm whitespace-nowrap bg-gray-100 hover:bg-gray-200 text-gray-700">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            Reset
                        </button>
                    </div>
                </div>
                <div class="table-scroll">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200 sticky top-0">
                            <tr>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">ID</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Name</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Email</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Phone</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Designation</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">CP Managers</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Channel Partners</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Status</th>
                                <th class="px-3 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="px-4 py-2 border-t border-gray-200 flex flex-col md:flex-row items-center justify-between gap-2">
                    <div class="flex items-center gap-2 text-xs text-gray-600">
                        <span>Records per page:</span>
                        <select id="recordsPerPage" onchange="changeRecordsPerPage()" class="px-2 py-1 border border-gray-300 rounded-lg focus:outline-none text-xs">
                            <option value="10">10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                            <option value="100">100</option>
                        </select>
                    </div>
                    <div class="text-xs text-gray-600">
                        Showing <span class="font-medium" id="showingStart">1</span> to <span class="font-medium" id="showingEnd">10</span> of <span class="font-medium" id="totalRecords">0</span> results
                    </div>
                    <div class="flex gap-1 flex-wrap justify-center">
                        <button id="prevBtn" onclick="previousPage()" class="px-2 py-1 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Previous</button>
                        <div id="paginationNumbers" class="flex gap-1"></div>
                        <button id="nextBtn" onclick="nextPage()" class="px-2 py-1 border border-gray-300 rounded-lg text-xs hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">Next</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Modal -->
    <div id="addModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="modal-content bg-white rounded-xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
                <h2 id="modalTitle" class="text-xl font-bold text-gray-900">Add New CP Head</h2>
                <button onclick="closeAddModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            
            <form id="addForm" onsubmit="handleSubmit(event)" class="p-6">
                <input type="hidden" id="editIndex" value="">
                <input type="hidden" id="viewMode" value="false">
                
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Name <span class="text-red-500">*</span></label>
                        <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Email <span class="text-red-500">*</span></label>
                        <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Phone <span class="text-red-500">*</span></label>
                        <input type="tel" id="phone" name="phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" pattern="[0-9+\s-]+" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Designation <span class="text-red-500">*</span></label>
                        <input type="text" id="designation" name="designation" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" required>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Role <span class="text-red-500">*</span></label>
                        <select id="role" name="role" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" required onchange="handleRoleChange()">
                            <option value="Head">Head</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Status <span class="text-red-500">*</span></label>
                        <select id="status" name="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500" required>
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex gap-3 mt-6" id="modalButtons">
                    <button type="submit" id="submitBtn" class="flex-1 text-white px-4 py-2 rounded-lg font-medium transition-colors" style="background: linear-gradient(135deg, #95c13d 0%, #7ba82d 100%);">
                        <span id="submitBtnText">Save</span>
                    </button>
                    <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition-colors">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let tableData = [
            { id: 'CPM001', name: 'John Doe', email: 'john.doe@example.com', phone: '+91 9876543210', designation: 'Regional Manager', role: 'Head', reportsTo: null, status: 'active', dateCreated: '2024-01-15', channelPartnersCount: 25 },
            { id: 'CPM004', name: 'Sarah Williams', email: 'sarah.w@example.com', phone: '+91 9876543213', designation: 'Operations Manager', role: 'Head', reportsTo: null, status: 'active', dateCreated: '2024-04-05', channelPartnersCount: 18 },
            { id: 'CPM007', name: 'Robert Wilson', email: 'robert.w@example.com', phone: '+91 9876543216', designation: 'District Manager', role: 'Head', reportsTo: null, status: 'active', dateCreated: '2024-07-22', channelPartnersCount: 32 }
        ];

        // CP Managers data for lookup
        const managersData = [
            { id: 'CPM002', name: 'Jane Smith', reportsTo: 'CPM001', status: 'active' },
            { id: 'CPM003', name: 'Mike Johnson', reportsTo: 'CPM001', status: 'inactive' },
            { id: 'CPM005', name: 'David Brown', reportsTo: 'CPM004', status: 'active' },
            { id: 'CPM006', name: 'Emily Davis', reportsTo: 'CPM004', status: 'inactive' },
            { id: 'CPM008', name: 'Lisa Anderson', reportsTo: 'CPM007', status: 'active' }
        ];

        function getManagersForHead(headId) {
            return managersData.filter(m => m.reportsTo === headId);
        }

        function getManagersTooltip(headId) {
            const managers = getManagersForHead(headId);
            if (managers.length === 0) return 'No managers assigned';
            return managers.map(m => m.name).join(', ');
        }

        let filteredData = [...tableData];
        let currentPage = 1;
        let recordsPerPage = 10;
        
        let selectedStatuses = [];
        let dateRange = { from: '', to: '' };

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (filteredData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-3 py-8 text-center text-gray-500 text-sm">No records found</td></tr>';
                updatePagination();
                updateStats();
                return;
            }
            
            const start = (currentPage - 1) * recordsPerPage;
            const end = start + recordsPerPage;
            const pageData = filteredData.slice(start, end);
            
            pageData.forEach((row, index) => {
                const managerCount = getManagersForHead(row.id).length;
                const managerTooltip = getManagersTooltip(row.id);
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="px-3 py-4 text-sm font-medium text-gray-900">${row.id}</td>
                    <td class="px-3 py-4 text-sm text-gray-900">${row.name}</td>
                    <td class="px-3 py-4 text-sm text-gray-600">${row.email}</td>
                    <td class="px-3 py-4 text-sm text-gray-600">${row.phone}</td>
                    <td class="px-3 py-4 text-sm text-gray-600">${row.designation}</td>
                    <td class="px-3 py-4 text-sm text-center">
                        <span class="inline-flex items-center justify-center px-3 py-1 bg-blue-100 text-blue-800 font-semibold rounded-full cursor-pointer" title="${managerTooltip}">
                            ${managerCount}
                        </span>
                    </td>
                    <td class="px-3 py-4 text-sm text-center">
                        <span class="inline-flex items-center justify-center text-blue-700 font-semibold">${row.channelPartnersCount}</span>
                    </td>
                    <td class="px-3 py-4">
                        <span class="inline-flex px-2 py-1 text-xs font-semibold rounded-full ${row.status === 'active' ? 'badge-active' : 'badge-inactive'}">
                            ${row.status.charAt(0).toUpperCase() + row.status.slice(1)}
                        </span>
                    </td>
                    <td class="px-3 py-4 text-sm">
                        <div class="action-icons">
                            <button onclick="viewRecord(${tableData.indexOf(row)})" title="View" class="text-gray-600 hover:text-gray-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                            <button onclick="editRecord(${tableData.indexOf(row)})" title="Edit" class="text-blue-600 hover:text-blue-800">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            ${row.status === 'active' ? 
                                `<button onclick="handleAction('deactivate', ${tableData.indexOf(row)})" title="Deactivate" class="text-orange-500 hover:text-orange-700">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </button>` : 
                                `<button onclick="handleAction('activate', ${tableData.indexOf(row)})" title="Activate" class="text-green-600 hover:text-green-800">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </button>`
                            }
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            
            updatePagination();
            updateStats();
        }

        function updatePagination() {
            const totalPages = Math.ceil(filteredData.length / recordsPerPage);
            const start = filteredData.length > 0 ? (currentPage - 1) * recordsPerPage + 1 : 0;
            const end = Math.min(currentPage * recordsPerPage, filteredData.length);
            
            document.getElementById('totalRecords').textContent = filteredData.length;
            document.getElementById('showingStart').textContent = start;
            document.getElementById('showingEnd').textContent = end;
            
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= totalPages || totalPages === 0;
            
            const paginationNumbers = document.getElementById('paginationNumbers');
            paginationNumbers.innerHTML = '';
            
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.className = i === currentPage 
                    ? 'px-2 py-1 text-white rounded-lg text-xs'
                    : 'px-2 py-1 border border-gray-300 rounded-lg text-xs hover:bg-gray-50';
                if (i === currentPage) {
                    btn.style.background = 'linear-gradient(135deg, #95c13d 0%, #7ba82d 100%)';
                }
                btn.onclick = () => goToPage(i);
                paginationNumbers.appendChild(btn);
            }
        }

        function updateStats() {
            const total = filteredData.length;
            const active = filteredData.filter(r => r.status === 'active').length;
            const inactive = filteredData.filter(r => r.status === 'inactive').length;
            
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-active').textContent = active;
            document.getElementById('stat-inactive').textContent = inactive;
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredData.length / recordsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderTable();
        }

        function changeRecordsPerPage() {
            recordsPerPage = parseInt(document.getElementById('recordsPerPage').value);
            currentPage = 1;
            renderTable();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function formatDateShort(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function filterTable() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = tableData.filter(row => {
                // Search filter
                const matchesSearch = !searchInput || 
                    row.name.toLowerCase().includes(searchInput) ||
                    row.email.toLowerCase().includes(searchInput) ||
                    row.phone.toLowerCase().includes(searchInput);
                
                // Status filter
                const matchesStatus = selectedStatuses.length === 0 || selectedStatuses.includes(row.status);
                
                // Date range filter
                let matchesDate = true;
                if (dateRange.from || dateRange.to) {
                    const rowDate = new Date(row.dateCreated);
                    if (dateRange.from && dateRange.to) {
                        const fromDate = new Date(dateRange.from);
                        const toDate = new Date(dateRange.to);
                        matchesDate = rowDate >= fromDate && rowDate <= toDate;
                    } else if (dateRange.from) {
                        const fromDate = new Date(dateRange.from);
                        matchesDate = rowDate >= fromDate;
                    } else if (dateRange.to) {
                        const toDate = new Date(dateRange.to);
                        matchesDate = rowDate <= toDate;
                    }
                }
                
                return matchesSearch && matchesStatus && matchesDate;
            });
            
            currentPage = 1;
            renderTable();
        }

        function toggleDropdown(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            const allDropdowns = document.querySelectorAll('.dropdown-menu');
            
            allDropdowns.forEach(dd => {
                if (dd.id !== dropdownId) {
                    dd.classList.remove('active');
                }
            });
            
            dropdown.classList.toggle('active');
        }

        function updateStatusFilter() {
            const checkboxes = document.querySelectorAll('.status-checkbox');
            selectedStatuses = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);
            
            const label = document.getElementById('statusFilterLabel');
            if (selectedStatuses.length === 0) {
                label.textContent = 'All Status';
            } else if (selectedStatuses.length === 1) {
                label.textContent = selectedStatuses[0].charAt(0).toUpperCase() + selectedStatuses[0].slice(1);
            } else {
                label.textContent = `${selectedStatuses.length} Selected`;
            }
            
            filterTable();
        }

        function updateDateFilter() {
            dateRange.from = document.getElementById('fromDate').value;
            dateRange.to = document.getElementById('toDate').value;
            
            const label = document.getElementById('dateFilterLabel');
            if (dateRange.from && dateRange.to) {
                label.textContent = `${formatDateShort(dateRange.from)} - ${formatDateShort(dateRange.to)}`;
            } else if (dateRange.from) {
                label.textContent = `From ${formatDateShort(dateRange.from)}`;
            } else if (dateRange.to) {
                label.textContent = `To ${formatDateShort(dateRange.to)}`;
            } else {
                label.textContent = 'Date Range';
            }
            
            filterTable();
        }

        function clearDateFilter() {
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            dateRange = { from: '', to: '' };
            document.getElementById('dateFilterLabel').textContent = 'Date Range';
            filterTable();
        }

        function resetAllFilters() {
            // Clear search input
            document.getElementById('searchInput').value = '';
            
            // Clear status checkboxes
            document.querySelectorAll('.status-checkbox').forEach(cb => cb.checked = false);
            selectedStatuses = [];
            document.getElementById('statusFilterLabel').textContent = 'All Status';
            
            // Clear date range
            document.getElementById('fromDate').value = '';
            document.getElementById('toDate').value = '';
            dateRange = { from: '', to: '' };
            document.getElementById('dateFilterLabel').textContent = 'Date Range';
            
            // Re-filter table
            filterTable();
        }

        function toggleUserMenu() {
            document.getElementById('userMenu').classList.toggle('active');
        }

        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('hidden');
        }

        function setActiveNav(element) {
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            element.classList.add('active');
        }

        function handleAction(action, index) {
            const item = tableData[index];
            
            if (action === 'activate') {
                tableData[index].status = 'active';
                alert(`${item.name} has been activated`);
            } else if (action === 'deactivate') {
                tableData[index].status = 'inactive';
                alert(`${item.name} has been deactivated`);
            }
            
            filterTable();
        }

        function viewRecord(index) {
            const record = tableData[index];
            
            document.getElementById('editIndex').value = index;
            document.getElementById('viewMode').value = 'true';
            
            // Disable all form fields first
            document.querySelectorAll('#addForm input, #addForm select, #addForm textarea').forEach(field => {
                field.disabled = true;
            });
            
            // Hide submit button, show only close button
            document.getElementById('modalButtons').innerHTML = `
                <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition-colors">
                    Close
                </button>
            `;
            
            // Now set the modal title
            document.getElementById('modalTitle').textContent = 'View CP Head';
            
            // Populate form fields
            document.getElementById('name').value = record.name;
            document.getElementById('email').value = record.email;
            document.getElementById('phone').value = record.phone;
            document.getElementById('designation').value = record.designation;
            document.getElementById('role').value = record.role;
            document.getElementById('status').value = record.status;
            
            openAddModal();
        }

        function editRecord(index) {
            const record = tableData[index];
            
            document.getElementById('editIndex').value = index;
            document.getElementById('viewMode').value = 'false';
            
            // Enable all form fields first
            document.querySelectorAll('#addForm input, #addForm select, #addForm textarea').forEach(field => {
                field.disabled = false;
            });
            
            // Restore buttons first
            document.getElementById('modalButtons').innerHTML = `
                <button type="submit" id="submitBtn" class="flex-1 text-white px-4 py-2 rounded-lg font-medium transition-colors" style="background: linear-gradient(135deg, #95c13d 0%, #7ba82d 100%);">
                    <span id="submitBtnText">Update</span>
                </button>
                <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            `;
            
            // Now set the modal title and button text
            document.getElementById('modalTitle').textContent = 'Edit CP Head';
            document.getElementById('submitBtnText').textContent = 'Update';
            
            // Populate form fields
            document.getElementById('name').value = record.name;
            document.getElementById('email').value = record.email;
            document.getElementById('phone').value = record.phone;
            document.getElementById('designation').value = record.designation;
            document.getElementById('role').value = record.role;
            document.getElementById('status').value = record.status;
            
            openAddModal();
        }

        function openAddModal() {
            document.getElementById('addModal').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addForm').reset();
            document.getElementById('modalTitle').textContent = 'Add New CP Head';
            document.getElementById('submitBtnText').textContent = 'Save';
            document.getElementById('editIndex').value = '';
            document.getElementById('viewMode').value = 'false';
            
            // Enable all form fields
            document.querySelectorAll('#addForm input, #addForm select, #addForm textarea').forEach(field => {
                field.disabled = false;
            });
            
            // Restore buttons
            document.getElementById('modalButtons').innerHTML = `
                <button type="submit" id="submitBtn" class="flex-1 text-white px-4 py-2 rounded-lg font-medium transition-colors" style="background: linear-gradient(135deg, #95c13d 0%, #7ba82d 100%);">
                    <span id="submitBtnText">Save</span>
                </button>
                <button type="button" onclick="closeAddModal()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg font-medium transition-colors">
                    Cancel
                </button>
            `;
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const editIndex = document.getElementById('editIndex').value;
            
            const entry = {
                name: formData.get('name'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                designation: formData.get('designation'),
                role: 'Head',
                reportsTo: null,
                status: formData.get('status')
            };
            
            if (editIndex !== '') {
                const index = parseInt(editIndex);
                tableData[index] = {
                    ...tableData[index],
                    ...entry
                };
                alert('CP Head updated successfully!');
            } else {
                const newEntry = {
                    id: 'CPM' + String(tableData.length + 1).padStart(3, '0'),
                    ...entry,
                    dateCreated: new Date().toISOString().split('T')[0],
                    channelPartnersCount: 0
                };
                tableData.unshift(newEntry);
                alert('CP Head added successfully!');
            }
            
            filterTable();
            closeAddModal();
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '../auth/login-org.html';
            }
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.relative') && !event.target.closest('button')) {
                document.querySelectorAll('.dropdown-menu').forEach(menu => {
                    menu.classList.remove('active');
                });
            }
        });

        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAddModal();
            }
        });

        // Initialize on page load
        renderTable();
    </script>
</body>
</html>
